quarkus:
  http:
    port: 8088
  application:
    name: nowchess-tournament
  datasource:
    db-kind: h2
    username: sa
    password: ""
    jdbc:
      url: "jdbc:h2:mem:nowchess-tournament;DB_CLOSE_DELAY=-1"
  hibernate-orm:
    schema-management:
      strategy: drop-and-create
  arc:
    exclude-types: de.nowchess.tournament.redis.GameResultStreamListener
mp:
  jwt:
    verify:
      publickey:
        location: keys/test-public.pem
      issuer: nowchess
smallrye:
  jwt:
    sign:
      key:
        location: keys/test-private.pem
nowchess:
  internal:
    secret: test-secret
    auth:
      enabled: false
